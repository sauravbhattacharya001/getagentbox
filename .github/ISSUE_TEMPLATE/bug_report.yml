name: 🐛 Bug Report
description: Report something broken on the landing page
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please provide as much detail as possible.

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the landing page is affected?
      options:
        - Hero section
        - Feature cards
        - Chat demo
        - Comparison table
        - FAQ accordion
        - CTA / Telegram link
        - Mobile layout
        - Performance
        - Analytics
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly
      placeholder: "When I click X, Y happens instead of Z..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Mobile Safari (iOS)
        - Chrome Mobile (Android)
        - Other
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop
        - Tablet
        - Phone
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshots
      description: Drag and drop screenshots if helpful
      placeholder: Paste or drag images here

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help (screen size, OS, etc.)
