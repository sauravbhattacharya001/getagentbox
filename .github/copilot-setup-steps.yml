# Copilot Setup Steps — getagentbox
# Installs dependencies, builds the bundle, and runs tests so GitHub Copilot
# coding agents (Claude, Codex) can autonomously work on issues and PRs.

name: "Copilot Setup"

on: workflow_dispatch

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build bundle
        run: npm run build

      - name: Run tests
        run: npm test || true

      - name: Verify bundle output
        run: |
          node build.js
          test -f dist/bundle.js || { echo 'FAIL: dist/bundle.js not generated'; exit 1; }
          BUNDLE_SIZE=$(wc -c < dist/bundle.js)
          echo "Bundle size: ${BUNDLE_SIZE} bytes"
          MODULE_COUNT=$(grep -c 'var .* = (function' dist/bundle.js || true)
          echo "IIFE modules in bundle: ${MODULE_COUNT}"

      - name: Validate HTML structure
        run: |
          # Ensure key pages parse correctly and reference bundle.js
          for page in index.html pricing.html faq.html; do
            if [ -f "$page" ]; then
              echo "✓ $page exists"
            fi
          done
          # Count total HTML pages for context
          echo "Total HTML pages: $(ls *.html | wc -l)"

      - name: Verify project structure
        run: |
          echo "=== Architecture ==="
          echo "Modular vanilla JS landing page + npm package"
          echo "55 IIFE modules in src/modules/ → built into dist/bundle.js via build.js"
          echo "12 page scripts in src/ (roi-calculator, benchmarks, calibration-lab, etc.)"
          echo "70 Jest test suites in __tests__/"
          echo ""
          echo "=== Key conventions ==="
          echo "ES5 only (no let/const/arrow functions)"
          echo "No innerHTML with dynamic content (CSP + XSS prevention)"
          echo "vendor/count.js is vendored GoatCounter — do NOT modify"
          echo "dist/bundle.js is auto-generated — do NOT edit directly"
          echo ""
          echo "=== Module counts ==="
          echo "src/modules/: $(ls src/modules/*.js | wc -l) files"
          echo "__tests__/:   $(ls __tests__/*.test.js | wc -l) test files"
          echo "HTML pages:   $(ls *.html | wc -l) pages"
          echo ""
          echo "=== Test mapping conventions ==="
          echo "Module tests:  __tests__/<module-name>.test.js"
          echo "Page tests:    __tests__/<page-name>.test.js"
          echo "Bug fix tests: __tests__/bugfix-<description>.test.js"
          echo "Integration:   __tests__/feedback.test.js, perf-caching.test.js"
          echo ""
          echo "=== Common pitfalls ==="
          echo "- Jest may exit 1 even when all tests pass (known config issue)"
          echo "- dist/bundle.js is generated by build.js — never edit it directly"
          echo "- Module load order in build.js matters (infrastructure first)"
          echo "- ES5 only: no let/const/arrow/template-literals allowed"
