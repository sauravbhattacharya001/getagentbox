# ----------------------------------------------------------------------------
# Auto-labeler configuration for pull requests
# ----------------------------------------------------------------------------
# Used by actions/labeler@v6 to tag PRs based on changed files.
# Every label referenced here must exist on the repo (see scripts/sync-labels.sh
# or .github/labels.yml if added later). When you introduce a new label here,
# also create it via `gh label create "<name>" --color <hex> --description "<txt>"`.
# ----------------------------------------------------------------------------

# Core application bundle (top-level JS entry points + non-module sources)
"app":
  - changed-files:
    - any-glob-to-any-file:
      - "app.js"
      - "src/*.js"
      - "build.js"

# Frontend / UI surface — touched HTML, CSS, or visual modules
"frontend":
  - changed-files:
    - any-glob-to-any-file:
      - "*.html"
      - "styles.css"
      - "src/modules/**/*.js"

# Static HTML pages (excludes index.html — it's both shell + frontend)
"html-page":
  - changed-files:
    - any-glob-to-any-file:
      - "*.html"
      - "!index.html"
      - "!404.html"

# Self-contained UI modules (single-purpose IIFE files)
"module":
  - changed-files:
    - any-glob-to-any-file:
      - "src/modules/**"

# Agent / advisor logic (the "agent-*.js" family at the top of src/)
"agent":
  - changed-files:
    - any-glob-to-any-file:
      - "src/agent-*.js"

# Vendored / third-party assets we don't author ourselves
"vendor":
  - changed-files:
    - any-glob-to-any-file:
      - "vendor/**"

# Build pipeline + repo scripts
"build":
  - changed-files:
    - any-glob-to-any-file:
      - "build.js"
      - "scripts/**"
      - "Makefile"

# Configuration files
"config":
  - changed-files:
    - any-glob-to-any-file:
      - "jest.config.js"
      - "webpack.config.js"
      - ".eslintrc*"
      - ".prettierrc*"
      - "tsconfig.json"
      - ".babelrc"
      - ".editorconfig"
      - "codecov.yml"
      - ".htmlvalidate*"

# Tests
"tests":
  - changed-files:
    - any-glob-to-any-file:
      - "__tests__/**"
      - "jest.config.js"
      - "**/*.test.js"

# CI/CD and GitHub workflows
"ci/cd":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/workflows/**"

# Docker
"docker":
  - changed-files:
    - any-glob-to-any-file:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

# Dependencies (manifests + lockfiles; covers dependabot PRs cleanly)
"dependencies":
  - changed-files:
    - any-glob-to-any-file:
      - "package.json"
      - "package-lock.json"
      - "yarn.lock"
      - "pnpm-lock.yaml"
      - ".github/dependabot.yml"

# Documentation
"documentation":
  - changed-files:
    - any-glob-to-any-file:
      - "*.md"
      - "docs/**"
      - ".github/copilot-instructions.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"

# Release / Deployment
"release":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/workflows/publish.yml"
      - ".github/workflows/pages.yml"
      - "CHANGELOG.md"

# GitHub Pages deployment (split out from generic release)
"pages":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/workflows/pages.yml"

# GitHub configuration (.github metadata files)
"github-config":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/dependabot.yml"
      - ".github/labeler.yml"
      - ".github/stale.yml"
      - ".github/copilot-setup-steps.yml"
      - ".github/FUNDING.yml"

# Security-related changes
"security":
  - changed-files:
    - any-glob-to-any-file:
      - "SECURITY.md"
      - ".github/workflows/codeql.yml"
      - ".github/dependabot.yml"
      - "scripts/apply-security-headers.js"

# Accessibility-related changes (a11y modules, panels, page)
"accessibility":
  - changed-files:
    - any-glob-to-any-file:
      - "accessibility.html"
      - "src/modules/accessibility-panel.js"
      - "__tests__/accessibility.test.js"

# Performance-related changes (perf tests, caching modules)
"performance":
  - changed-files:
    - any-glob-to-any-file:
      - "__tests__/perf-*.test.js"
      - "__tests__/*-perf.test.js"

# Test coverage configuration
"coverage":
  - changed-files:
    - any-glob-to-any-file:
      - "codecov.yml"
      - ".github/workflows/coverage.yml"
