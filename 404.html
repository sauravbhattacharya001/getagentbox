<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | AgentBox</title>
    <meta name="description" content="This page doesn't exist. Let's get you back to AgentBox.">
    <style>
        :root {
            --color-primary: #00d4ff;
            --color-primary-alt: #646cff;
            --color-bg-deep: #1a1a2e;
            --color-bg-mid: #16213e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--color-bg-deep);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            overflow: hidden;
        }

        .bot-face {
            font-size: 6rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-alt));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 1rem;
        }

        .message {
            font-size: 1.1rem;
            color: #a0a0b0;
            max-width: 500px;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .chat-bubble {
            background: var(--color-bg-mid);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 16px 16px 16px 4px;
            padding: 1rem 1.5rem;
            max-width: 400px;
            margin-bottom: 2rem;
            text-align: left;
            position: relative;
        }

        .chat-bubble::before {
            content: '🤖 AgentBox';
            display: block;
            font-size: 0.75rem;
            color: var(--color-primary);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .chat-bubble p {
            color: #c0c0d0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
            margin-top: 0.5rem;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-primary);
            animation: blink 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 60%, 100% { opacity: 0.2; }
            30% { opacity: 1; }
        }

        .actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-alt));
            color: #fff;
        }

        .btn-secondary {
            background: var(--color-bg-mid);
            color: var(--color-primary);
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--color-primary);
            border-radius: 50%;
            opacity: 0.15;
            animation: drift linear infinite;
        }

        @keyframes drift {
            from { transform: translateY(100vh) rotate(0deg); }
            to { transform: translateY(-100px) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="bot-face">🤖</div>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>

    <div class="chat-bubble">
        <p>Hmm, I searched everywhere but couldn't find that page. Maybe it moved, or maybe it never existed. Either way, I've got your back.</p>
        <div class="typing-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <p class="message">Let's get you somewhere useful.</p>

    <div class="actions">
        <a href="/" class="btn btn-primary">🏠 Back to Home</a>
        <a href="https://t.me/AgentBox11Bot" class="btn btn-secondary" target="_blank" rel="noopener">💬 Try AgentBox</a>
    </div>

    <script>
        (function() {
            var container = document.getElementById('particles');
            for (var i = 0; i < 20; i++) {
                var p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 12) + 's';
                p.style.animationDelay = -(Math.random() * 20) + 's';
                p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
                container.appendChild(p);
            }
        })();
    </script>
</body>
</html>
