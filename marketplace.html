    <style>
        :root {
            --color-primary: #00d4ff;
            --color-primary-alt: #646cff;
            --color-accent: #7b2cbf;
            --color-success: #4ade80;
            --color-warning: #fbbf24;
            --color-error: #f87171;
            --color-bg-deep: #1a1a2e;
            --color-bg-mid: #16213e;
            --color-bg-far: #0f3460;
            --color-surface: rgba(255, 255, 255, 0.05);
            --color-surface-hover: rgba(255, 255, 255, 0.1);
            --color-text: #fff;
            --color-text-muted: #a0a0a0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--color-bg-deep);
            color: var(--color-text);
            min-height: 100vh;
            padding: 0;
        }
        a { color: var(--color-primary); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Header */
        .mp-header {
            text-align: center;
            padding: 3rem 1rem 2rem;
            background: linear-gradient(135deg, var(--color-bg-mid), var(--color-bg-far));
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .mp-header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        .mp-header h1 span { color: var(--color-primary); }
        .mp-header p { color: var(--color-text-muted); max-width: 600px; margin: 0 auto; }
        .mp-back { display: inline-block; margin-bottom: 1rem; color: var(--color-text-muted); font-size: 0.9rem; }
        .mp-back:hover { color: var(--color-primary); }

        /* Controls */
        .mp-controls {
            max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem;
            display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;
        }
        .mp-search {
            flex: 1; min-width: 220px; padding: 0.7rem 1rem; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15); background: var(--color-surface);
            color: var(--color-text); font-size: 0.95rem; outline: none;
        }
        .mp-search:focus { border-color: var(--color-primary); }
        .mp-sort {
            padding: 0.7rem 1rem; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15); background: var(--color-surface);
            color: var(--color-text); font-size: 0.9rem; cursor: pointer;
        }
        .mp-count { color: var(--color-text-muted); font-size: 0.85rem; }

        /* Categories */
        .mp-categories {
            max-width: 1200px; margin: 0 auto 1rem; padding: 0 1rem;
            display: flex; gap: 0.5rem; flex-wrap: wrap;
        }
        .mp-cat {
            padding: 0.4rem 0.9rem; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15);
            background: transparent; color: var(--color-text-muted); cursor: pointer;
            font-size: 0.85rem; transition: all 0.2s;
        }
        .mp-cat:hover { border-color: var(--color-primary); color: var(--color-text); }
        .mp-cat.active { background: var(--color-primary); color: #000; border-color: var(--color-primary); font-weight: 600; }

        /* Grid */
        .mp-grid {
            max-width: 1200px; margin: 0 auto; padding: 0 1rem 3rem;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.2rem;
        }

        /* Card */
        .mp-card {
            background: var(--color-surface); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 1.5rem; transition: all 0.25s;
            display: flex; flex-direction: column;
        }
        .mp-card:hover { border-color: var(--color-primary); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .mp-card-top { display: flex; align-items: flex-start; gap: 0.8rem; margin-bottom: 0.8rem; }
        .mp-card-icon { font-size: 2rem; line-height: 1; flex-shrink: 0; }
        .mp-card-meta { flex: 1; }
        .mp-card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.2rem; }
        .mp-card-author { font-size: 0.8rem; color: var(--color-text-muted); }
        .mp-card-badge {
            display: inline-block; padding: 0.15rem 0.5rem; border-radius: 10px;
            font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
        }
        .mp-badge-official { background: var(--color-primary); color: #000; }
        .mp-badge-popular { background: var(--color-accent); color: #fff; }
        .mp-badge-new { background: var(--color-success); color: #000; }
        .mp-card-desc { font-size: 0.9rem; color: var(--color-text-muted); line-height: 1.5; flex: 1; margin-bottom: 1rem; }
        .mp-card-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .mp-tag {
            padding: 0.2rem 0.5rem; border-radius: 6px; font-size: 0.75rem;
            background: rgba(255,255,255,0.06); color: var(--color-text-muted);
        }
        .mp-card-footer { display: flex; justify-content: space-between; align-items: center; }
        .mp-card-stats { display: flex; gap: 1rem; font-size: 0.8rem; color: var(--color-text-muted); }
        .mp-card-stats span { display: flex; align-items: center; gap: 0.3rem; }
        .mp-deploy-btn {
            padding: 0.45rem 1rem; border-radius: 8px; border: none;
            background: var(--color-primary); color: #000; font-weight: 600;
            font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
        }
        .mp-deploy-btn:hover { background: #33ddff; transform: scale(1.03); }
        .mp-deploy-btn.deployed { background: var(--color-success); pointer-events: none; }

        /* Detail Modal */
        .mp-modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            z-index: 1000; justify-content: center; align-items: center; padding: 1rem;
        }
        .mp-modal-overlay.open { display: flex; }
        .mp-modal {
            background: var(--color-bg-mid); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; max-width: 640px; width: 100%; max-height: 85vh;
            overflow-y: auto; padding: 2rem; position: relative;
        }
        .mp-modal-close {
            position: absolute; top: 1rem; right: 1rem; background: none; border: none;
            color: var(--color-text-muted); font-size: 1.5rem; cursor: pointer;
        }
        .mp-modal-close:hover { color: var(--color-text); }
        .mp-modal h2 { font-size: 1.5rem; margin-bottom: 0.3rem; }
        .mp-modal .mp-card-author { margin-bottom: 1rem; }
        .mp-modal-section { margin-bottom: 1.2rem; }
        .mp-modal-section h3 { font-size: 0.95rem; color: var(--color-primary); margin-bottom: 0.5rem; }
        .mp-modal-section p, .mp-modal-section ul { font-size: 0.9rem; color: var(--color-text-muted); line-height: 1.6; }
        .mp-modal-section ul { padding-left: 1.2rem; }
        .mp-modal-section li { margin-bottom: 0.3rem; }
        .mp-modal-config {
            background: rgba(0,0,0,0.3); border-radius: 8px; padding: 1rem;
            font-family: 'Courier New', monospace; font-size: 0.85rem;
            color: var(--color-success); overflow-x: auto; white-space: pre;
        }
        .mp-modal-deploy {
            width: 100%; padding: 0.8rem; border-radius: 10px; border: none;
            background: var(--color-primary); color: #000; font-weight: 700;
            font-size: 1rem; cursor: pointer; margin-top: 1rem; transition: all 0.2s;
        }
        .mp-modal-deploy:hover { background: #33ddff; }
        .mp-stars { color: var(--color-warning); }

        /* Empty State */
        .mp-empty {
            grid-column: 1 / -1; text-align: center; padding: 3rem;
            color: var(--color-text-muted); font-size: 1.1rem;
        }

        @media (max-width: 500px) {
            .mp-header h1 { font-size: 1.6rem; }
            .mp-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        function getStars(rating) {
            const full = Math.floor(rating);
            const half = rating - full >= 0.5;
            return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(5 - full - (half ? 1 : 0));
        }

            return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : n.toString();
        }

            }
            const sorters = {
                popular: (a, b) => b.installs - a.installs,
                rating: (a, b) => b.rating - a.rating,
                newest: (a, b) => new Date(b.created) - new Date(a.created),
                name: (a, b) => a.name.localeCompare(b.name),
                installs: (a, b) => b.installs - a.installs
            };
            list.sort(sorters[sortBy] || sorters.popular);
            return list;
        }

        function renderGrid() {
            const list = filtered();
            countEl.textContent = list.length + ' agent' + (list.length !== 1 ? 's' : '');
            if (!list.length) {
                grid.innerHTML = '<div class="mp-empty">No agents match your search. Try different keywords or clear filters.</div>';
                return;
            }
            grid.innerHTML = list.map(a => `
                <div class="mp-card" data-id="${a.id}">
                    <div class="mp-card-top">
                        <div class="mp-card-icon">${a.icon}</div>
                        <div class="mp-card-meta">
                            <div class="mp-card-title">${a.name}</div>
                            <div class="mp-card-author">by ${a.author} ${getBadgeHTML(a.badge)}</div>
                        </div>
                    </div>
                    <div class="mp-card-desc">${a.desc}</div>
                    <div class="mp-card-tags">${a.tags.map(t => '<span class="mp-tag">' + t + '</span>').join('')}</div>
                    <div class="mp-card-footer">
                        <div class="mp-card-stats">
                            <span class="mp-stars">${getStars(a.rating)}</span>
                            <span>${a.rating}</span>
                            <span>📥 ${formatNumber(a.installs)}</span>
                        </div>
                        <button class="mp-deploy-btn${deployed.has(a.id) ? ' deployed' : ''}" data-deploy="${a.id}">
                            ${deployed.has(a.id) ? '✓ Deployed' : 'Deploy'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openModal(agent) {
            modalContent.innerHTML = `
                <button class="mp-modal-close" aria-label="Close">&times;</button>
                <div style="display:flex;align-items:center;gap:0.8rem;margin-bottom:0.3rem;">
                    <span style="font-size:2.5rem;">${agent.icon}</span>
                    <div>
                        <h2>${agent.name}</h2>
                        <div class="mp-card-author">by ${agent.author} ${getBadgeHTML(agent.badge)}</div>
                    </div>
                </div>
                <div style="display:flex;gap:1.5rem;margin:1rem 0;font-size:0.9rem;color:var(--color-text-muted);">
                    <span class="mp-stars">${getStars(agent.rating)}</span>
                    <span>${agent.rating} (${agent.reviews} reviews)</span>
                    <span>📥 ${formatNumber(agent.installs)} installs</span>
                    <span>📁 ${agent.category}</span>
                </div>
                <div class="mp-modal-section">
                    <h3>Description</h3>
                    <p>${agent.desc}</p>
                </div>
                <div class="mp-modal-section">
                    <h3>Features</h3>
                    <ul>${agent.features.map(f => '<li>' + f + '</li>').join('')}</ul>
                </div>
                <div class="mp-modal-section">
                    <h3>Sample Configuration</h3>
                    <div class="mp-modal-config">${agent.config}</div>
                </div>
                <div class="mp-modal-section">
                    <h3>Tags</h3>
                    <div class="mp-card-tags">${agent.tags.map(t => '<span class="mp-tag">' + t + '</span>').join('')}</div>
                </div>
                <button class="mp-modal-deploy${deployed.has(agent.id) ? ' deployed' : ''}" data-deploy="${agent.id}">
                    ${deployed.has(agent.id) ? '✓ Deployed to Your AgentBox' : '🚀 Deploy This Agent'}
                </button>
            `;
            modalOverlay.classList.add('open');
        }

        function deploy(id) {
            deployed.add(id);
            renderGrid();
            if (modalOverlay.classList.contains('open')) {
                const btn = modalContent.querySelector('.mp-modal-deploy');
                if (btn) { btn.classList.add('deployed'); btn.textContent = '✓ Deployed to Your AgentBox'; }
            }
        }

        // Events
        catContainer.addEventListener('click', function(e) {
            const btn = e.target.closest('.mp-cat');
            if (!btn) return;
            activeCategory = btn.dataset.cat;
            renderCategories();
            renderGrid();
        });

        search.addEventListener('input', function() {
            searchTerm = this.value.trim();
            renderGrid();
        });

        sort.addEventListener('change', function() {
            sortBy = this.value;
            renderGrid();
        });

        grid.addEventListener('click', function(e) {
            const deployBtn = e.target.closest('.mp-deploy-btn');
            if (deployBtn) { e.stopPropagation(); deploy(deployBtn.dataset.deploy); return; }
            const card = e.target.closest('.mp-card');
            if (card) { const a = AGENTS.find(x => x.id === card.dataset.id); if (a) openModal(a); }
        });

        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay || e.target.closest('.mp-modal-close')) {
                modalOverlay.classList.remove('open');
            }
            const deployBtn = e.target.closest('.mp-modal-deploy');
            if (deployBtn && !deployBtn.classList.contains('deployed')) deploy(deployBtn.dataset.deploy);
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modalOverlay.classList.contains('open')) modalOverlay.classList.remove('open');
        });

        // Init
        renderCategories();
        renderGrid();
    })();
    </script>
</body>
</html>
