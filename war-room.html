<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent War Room — AgentBox</title>
    <meta name="description" content="Interactive incident command center where multiple AI agents coordinate in real-time to detect, triage, mitigate, and resolve incidents autonomously.">
    <style>
        :root {
            --color-primary: #00d4ff;
            --color-primary-alt: #646cff;
            --color-accent: #7b2cbf;
            --color-success: #4ade80;
            --color-warning: #fbbf24;
            --color-danger: #ef4444;
            --color-bg-deep: #1a1a2e;
            --color-bg-mid: #16213e;
            --color-surface: rgba(255, 255, 255, 0.05);
            --color-surface-hover: rgba(255, 255, 255, 0.1);
            --color-text: #fff;
            --color-text-muted: #a0a0a0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--color-bg-deep);
            color: var(--color-text);
            min-height: 100vh;
        }
        .wr-header {
            text-align: center;
            padding: 2rem 1rem 1rem;
        }
        .wr-header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--color-danger), var(--color-warning), var(--color-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .wr-header p { color: var(--color-text-muted); max-width: 600px; margin: 0 auto; }

        .wr-controls {
            display: flex; justify-content: center; gap: 0.5rem; padding: 1rem; flex-wrap: wrap;
        }
        .wr-btn {
            padding: 0.5rem 1rem; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
            background: var(--color-surface); color: var(--color-text); cursor: pointer;
            font-size: 0.85rem; transition: all 0.2s;
        }
        .wr-btn:hover { background: var(--color-surface-hover); }
        .wr-btn.active { border-color: var(--color-primary); color: var(--color-primary); }
        .wr-btn.danger { border-color: var(--color-danger); color: var(--color-danger); }
        .wr-btn.danger:hover { background: rgba(239,68,68,0.15); }

        .wr-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            grid-template-rows: auto 1fr;
            gap: 1rem;
            padding: 0 1rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 600px;
        }
        .wr-card {
            background: var(--color-bg-mid);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 1rem;
            overflow: hidden;
        }
        .wr-card h3 {
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--color-text-muted); margin-bottom: 0.75rem;
        }

        /* Incident Board */
        .incident-board { grid-column: 1 / -1; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
        .sev-badge {
            font-size: 1.4rem; font-weight: 800; padding: 0.3rem 0.8rem; border-radius: 6px;
            display: inline-block;
        }
        .sev-1 { background: var(--color-danger); color: #fff; }
        .sev-2 { background: #f97316; color: #fff; }
        .sev-3 { background: var(--color-warning); color: #000; }
        .sev-4 { background: #60a5fa; color: #000; }
        .incident-title { font-size: 1.3rem; font-weight: 700; flex: 1; }
        .incident-timer { font-family: monospace; font-size: 1.3rem; color: var(--color-primary); }
        .phase-bar { display: flex; gap: 2px; }
        .phase-step {
            padding: 0.3rem 0.6rem; font-size: 0.7rem; border-radius: 4px;
            background: rgba(255,255,255,0.05); color: var(--color-text-muted);
            transition: all 0.3s;
        }
        .phase-step.active { background: var(--color-primary); color: #000; font-weight: 600; }
        .phase-step.done { background: var(--color-success); color: #000; }

        /* Agents Panel */
        .agents-panel { grid-row: 2; }
        .agent-row {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.5rem; border-radius: 8px; margin-bottom: 0.4rem;
            background: var(--color-surface); transition: all 0.3s;
        }
        .agent-row.acting { border-left: 3px solid var(--color-warning); }
        .agent-row.investigating { border-left: 3px solid var(--color-primary); }
        .agent-row.reporting { border-left: 3px solid var(--color-success); }
        .agent-avatar { font-size: 1.4rem; width: 2rem; text-align: center; }
        .agent-info { flex: 1; }
        .agent-name { font-size: 0.85rem; font-weight: 600; }
        .agent-role { font-size: 0.65rem; color: var(--color-text-muted); }
        .agent-status {
            font-size: 0.6rem; padding: 2px 6px; border-radius: 10px;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .status-idle { background: rgba(255,255,255,0.1); color: var(--color-text-muted); }
        .status-investigating { background: rgba(0,212,255,0.2); color: var(--color-primary); }
        .status-acting { background: rgba(251,191,36,0.2); color: var(--color-warning); }
        .status-reporting { background: rgba(74,222,128,0.2); color: var(--color-success); }

        /* Timeline */
        .timeline-panel { grid-row: 2; overflow-y: auto; max-height: 500px; }
        .timeline-entry {
            padding: 0.5rem; border-left: 2px solid rgba(255,255,255,0.1);
            margin-left: 0.5rem; margin-bottom: 0.3rem;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .timeline-time { font-size: 0.6rem; color: var(--color-text-muted); font-family: monospace; }
        .timeline-agent { font-size: 0.7rem; font-weight: 600; }
        .timeline-msg { font-size: 0.8rem; color: #ccc; }
        .timeline-entry.escalation {
            border-left-color: var(--color-danger);
            background: rgba(239,68,68,0.08); border-radius: 0 6px 6px 0;
        }

        /* Metrics */
        .metrics-panel { grid-row: 2; }
        .metric-card {
            background: var(--color-surface); border-radius: 8px; padding: 0.6rem;
            margin-bottom: 0.5rem;
        }
        .metric-label { font-size: 0.7rem; color: var(--color-text-muted); }
        .metric-value { font-size: 1.3rem; font-weight: 700; }
        .metric-value.degraded { color: var(--color-danger); }
        .metric-value.recovering { color: var(--color-warning); }
        .metric-value.healthy { color: var(--color-success); }
        .metric-canvas { width: 100%; height: 35px; margin-top: 4px; }

        .back-link {
            display: inline-block; padding: 0.5rem 1rem; color: var(--color-primary);
            text-decoration: none; font-size: 0.85rem;
        }
        .back-link:hover { text-decoration: underline; }

        @media (max-width: 900px) {
            .wr-grid { grid-template-columns: 1fr; }
            .incident-board { grid-column: 1; }
            .timeline-panel { max-height: 300px; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to AgentBox</a>
    <div class="wr-header">
        <h1>🚨 Agent War Room</h1>
        <p>Watch autonomous agents coordinate in real-time to detect, triage, and resolve incidents — no humans required.</p>
    </div>
    <div class="wr-controls">
        <button class="wr-btn danger" id="btnNewIncident">⚡ New Incident</button>
        <button class="wr-btn" id="btnPause">⏸ Pause</button>
        <button class="wr-btn" id="btnEscalate">🔺 Escalate</button>
        <button class="wr-btn" id="btnSpeed1" data-speed="1">1×</button>
        <button class="wr-btn" id="btnSpeed2" data-speed="2">2×</button>
        <button class="wr-btn" id="btnSpeed5" data-speed="5">5×</button>
    </div>
    <div class="wr-grid">
        <div class="wr-card incident-board" id="incidentBoard"></div>
        <div class="wr-card agents-panel" id="agentsPanel"><h3>🤖 Agent Team</h3><div id="agentsList"></div></div>
        <div class="wr-card timeline-panel" id="timelinePanel"><h3>📋 Action Timeline</h3><div id="timeline"></div></div>
        <div class="wr-card metrics-panel" id="metricsPanel"><h3>📊 Live Metrics</h3><div id="metricsList"></div></div>
    </div>

    <script>
    (function() {
        var SCENARIOS = [
            { title: 'API Latency Spike', sev: 1, desc: 'P99 latency exceeding 5s across all endpoints' },
            { title: 'Database Connection Pool Exhausted', sev: 2, desc: 'PostgreSQL pool at 100% — queries queuing' },
            { title: 'Auth Service 503', sev: 1, desc: 'Authentication service returning 503 for all regions' },
            { title: 'Memory Leak Detected', sev: 2, desc: 'Worker process RSS growing 50MB/min unbounded' },
            { title: 'Certificate Expiring in 2h', sev: 3, desc: 'TLS cert for api.agentbox.ai expires at 14:00 UTC' },
            { title: 'Disk Usage Critical (95%)', sev: 2, desc: 'Log volume /var/log approaching full capacity' },
            { title: 'Cascading Timeout Failure', sev: 1, desc: 'Downstream service timeouts propagating upstream' },
            { title: 'Rate Limiter Misconfiguration', sev: 3, desc: 'Legitimate users hitting 429 — threshold too low' }
        ];
        var PHASES = ['Detection', 'Triage', 'Mitigation', 'Recovery', 'Resolved'];
        var AGENTS = [
            { name: 'Commander', emoji: '🎖️', role: 'Incident Commander' },
            { name: 'Sentinel', emoji: '🔍', role: 'Diagnostics Agent' },
            { name: 'Fixer', emoji: '🔧', role: 'Mitigation Agent' },
            { name: 'Herald', emoji: '📢', role: 'Communications Lead' },
            { name: 'Watcher', emoji: '📡', role: 'Monitoring Agent' },
            { name: 'Scribe', emoji: '📝', role: 'Scribe' }
        ];
        var ACTIONS = {
            0: [ // Detection
                [1, 'investigating', 'Anomaly detected — running initial diagnostics'],
                [4, 'investigating', 'Confirming alert validity across monitoring signals'],
                [0, 'acting', 'Declaring incident — assembling response team']
            ],
            1: [ // Triage
                [1, 'investigating', 'Analyzing error patterns and stack traces'],
                [0, 'acting', 'Assigning severity and setting response SLA'],
                [3, 'acting', 'Notifying on-call team and stakeholders'],
                [5, 'reporting', 'Logging incident timeline and initial observations'],
                [1, 'investigating', 'Correlating with recent deployments and config changes']
            ],
            2: [ // Mitigation
                [1, 'investigating', 'Root cause identified — preparing remediation plan'],
                [2, 'acting', 'Applying fix — rolling out configuration change'],
                [4, 'investigating', 'Watching metrics for improvement signal'],
                [0, 'acting', 'Approving remediation — monitoring rollout'],
                [3, 'acting', 'Sending stakeholder update: mitigation in progress'],
                [2, 'acting', 'Scaling up additional capacity as safety net']
            ],
            3: [ // Recovery
                [4, 'investigating', 'Metrics returning to baseline — verifying stability'],
                [1, 'investigating', 'Running validation checks across all endpoints'],
                [2, 'reporting', 'Remediation confirmed effective — no regression'],
                [0, 'acting', 'Initiating recovery phase — standing down response'],
                [3, 'acting', 'Broadcasting all-clear to stakeholders']
            ],
            4: [ // Resolved
                [5, 'reporting', 'Compiling post-mortem timeline and action items'],
                [0, 'reporting', 'Incident resolved — scheduling retrospective'],
                [1, 'reporting', 'Documenting root cause analysis and prevention steps']
            ]
        };

        var state = { running: false, paused: false, speed: 1, scenario: null, phase: 0, elapsed: 0, actionIdx: 0, escalations: 0, agentStatuses: [] };
        var metrics = [
            { label: 'Response Time', unit: 'ms', baseline: 120, current: 120, data: [] },
            { label: 'Error Rate', unit: '%', baseline: 0.2, current: 0.2, data: [] },
            { label: 'CPU Usage', unit: '%', baseline: 35, current: 35, data: [] },
            { label: 'Active Connections', unit: '', baseline: 1200, current: 1200, data: [] }
        ];
        var intervals = [];

        function $(id) { return document.getElementById(id); }
        function clearIntervals() { intervals.forEach(clearInterval); intervals = []; }

        function startIncident() {
            clearIntervals();
            state.scenario = SCENARIOS[Math.floor(Math.random() * SCENARIOS.length)];
            state.phase = 0; state.elapsed = 0; state.actionIdx = 0; state.paused = false;
            state.running = true; state.escalations = 0;
            state.agentStatuses = AGENTS.map(function() { return 'idle'; });
            metrics.forEach(function(m) { m.current = m.baseline; m.data = []; });
            $('timeline').innerHTML = '';
            $('btnPause').textContent = '⏸ Pause';
            renderIncidentBoard();
            renderAgents();
            renderMetrics();
            addTimelineEntry(0, 'acting', '🚨 INCIDENT DECLARED: ' + state.scenario.title + ' [SEV-' + state.scenario.sev + ']', true);

            intervals.push(setInterval(tick, 1000));
            intervals.push(setInterval(advanceAction, Math.max(800, 3000 / state.speed)));
            intervals.push(setInterval(updateMetrics, Math.max(500, 1500 / state.speed)));
        }

        function tick() {
            if (state.paused || !state.running) return;
            state.elapsed++;
            renderIncidentBoard();
        }

        function advanceAction() {
            if (state.paused || !state.running) return;
            var phaseActions = ACTIONS[state.phase];
            if (!phaseActions || state.actionIdx >= phaseActions.length) {
                if (state.phase < 4) {
                    state.phase++;
                    state.actionIdx = 0;
                    renderIncidentBoard();
                    if (state.phase === 4) {
                        addTimelineEntry(0, 'reporting', '✅ INCIDENT RESOLVED — Total time: ' + formatTime(state.elapsed), true);
                        state.running = false;
                    }
                }
                return;
            }
            var action = phaseActions[state.actionIdx];
            state.agentStatuses = AGENTS.map(function() { return 'idle'; });
            state.agentStatuses[action[0]] = action[1];
            renderAgents();
            addTimelineEntry(action[0], action[1], action[2]);
            state.actionIdx++;

            // Auto-escalation check
            if (state.phase === 2 && state.actionIdx === 2 && state.escalations === 0 && Math.random() > 0.5) {
                doEscalate();
            }
        }

        function updateMetrics() {
            if (state.paused || !state.running) return;
            var factor;
            if (state.phase <= 1) { factor = 1 + (state.phase === 0 ? 0.15 : 0.08); } // degrading
            else if (state.phase === 2) { factor = 1 + (Math.random() * 0.04 - 0.03); } // stabilizing
            else { factor = 1 - 0.06; } // recovering

            metrics.forEach(function(m, i) {
                if (state.phase <= 1) {
                    var spike = i === 0 ? 3 : (i === 1 ? 2.5 : 1.5);
                    m.current = Math.min(m.current * (factor + (Math.random() * 0.05) * spike), m.baseline * (i === 0 ? 15 : (i === 1 ? 50 : 3)));
                } else if (state.phase >= 3) {
                    m.current = m.current * factor + m.baseline * 0.06;
                    if (m.current < m.baseline * 1.05) m.current = m.baseline * (0.95 + Math.random() * 0.1);
                } else {
                    m.current *= factor;
                }
                m.data.push(m.current);
                if (m.data.length > 30) m.data.shift();
            });
            renderMetrics();
        }

        function doEscalate() {
            state.escalations++;
            if (state.scenario.sev > 1) state.scenario.sev--;
            addTimelineEntry(-1, 'escalation', '🔺 AUTO-ESCALATION: Severity raised to SEV-' + state.scenario.sev + ' — metrics not improving', true);
            renderIncidentBoard();
        }

        function addTimelineEntry(agentIdx, type, msg, highlight) {
            var el = document.createElement('div');
            el.className = 'timeline-entry' + (highlight ? ' escalation' : '');
            var agent = agentIdx >= 0 ? AGENTS[agentIdx] : { emoji: '⚠️', name: 'SYSTEM' };
            var colors = { investigating: '#00d4ff', acting: '#fbbf24', reporting: '#4ade80', escalation: '#ef4444' };
            el.innerHTML = '<div class="timeline-time">' + formatTime(state.elapsed) + '</div>' +
                '<div class="timeline-agent" style="color:' + (colors[type] || '#fff') + '">' + agent.emoji + ' ' + agent.name + '</div>' +
                '<div class="timeline-msg">' + msg + '</div>';
            var tl = $('timeline');
            tl.prepend(el);
        }

        function renderIncidentBoard() {
            if (!state.scenario) { $('incidentBoard').innerHTML = '<p style="color:var(--color-text-muted)">Press <strong>⚡ New Incident</strong> to begin simulation</p>'; return; }
            var html = '<span class="sev-badge sev-' + state.scenario.sev + '">SEV-' + state.scenario.sev + '</span>' +
                '<div style="flex:1"><div class="incident-title">' + state.scenario.title + '</div>' +
                '<div style="font-size:0.8rem;color:var(--color-text-muted)">' + state.scenario.desc + '</div></div>' +
                '<div class="incident-timer">' + formatTime(state.elapsed) + '</div>' +
                '<div class="phase-bar">' + PHASES.map(function(p, i) {
                    var cls = i < state.phase ? 'done' : (i === state.phase ? 'active' : '');
                    return '<span class="phase-step ' + cls + '">' + p + '</span>';
                }).join('') + '</div>';
            $('incidentBoard').innerHTML = html;
        }

        function renderAgents() {
            $('agentsList').innerHTML = AGENTS.map(function(a, i) {
                var st = state.agentStatuses[i] || 'idle';
                return '<div class="agent-row ' + st + '">' +
                    '<span class="agent-avatar">' + a.emoji + '</span>' +
                    '<div class="agent-info"><div class="agent-name">' + a.name + '</div><div class="agent-role">' + a.role + '</div></div>' +
                    '<span class="agent-status status-' + st + '">' + st + '</span></div>';
            }).join('');
        }

        function renderMetrics() {
            $('metricsList').innerHTML = metrics.map(function(m, idx) {
                var ratio = m.current / m.baseline;
                var cls = ratio > 2 ? 'degraded' : (ratio > 1.3 ? 'recovering' : 'healthy');
                var val = m.current < 10 ? m.current.toFixed(2) : Math.round(m.current);
                return '<div class="metric-card"><div class="metric-label">' + m.label + '</div>' +
                    '<div class="metric-value ' + cls + '">' + val + ' ' + m.unit + '</div>' +
                    '<canvas class="metric-canvas" id="spark' + idx + '" width="200" height="35"></canvas></div>';
            }).join('');
            metrics.forEach(function(m, idx) { drawSparkline($('spark' + idx), m); });
        }

        function drawSparkline(canvas, metric) {
            if (!canvas || !metric.data.length) return;
            var ctx = canvas.getContext('2d');
            var w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            var data = metric.data;
            var max = Math.max.apply(null, data) * 1.1 || 1;
            var min = Math.min.apply(null, data) * 0.9;
            var range = max - min || 1;
            ctx.beginPath();
            ctx.strokeStyle = metric.current / metric.baseline > 2 ? '#ef4444' : (metric.current / metric.baseline > 1.3 ? '#fbbf24' : '#4ade80');
            ctx.lineWidth = 1.5;
            data.forEach(function(v, i) {
                var x = (i / (data.length - 1 || 1)) * w;
                var y = h - ((v - min) / range) * (h - 4) - 2;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();
        }

        function formatTime(s) {
            var m = Math.floor(s / 60); var sec = s % 60;
            return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
        }

        // Controls
        $('btnNewIncident').addEventListener('click', startIncident);
        $('btnPause').addEventListener('click', function() {
            state.paused = !state.paused;
            this.textContent = state.paused ? '▶ Resume' : '⏸ Pause';
        });
        $('btnEscalate').addEventListener('click', function() { if (state.running) doEscalate(); });

        ['btnSpeed1', 'btnSpeed2', 'btnSpeed5'].forEach(function(id) {
            $(id).addEventListener('click', function() {
                state.speed = parseInt(this.dataset.speed);
                document.querySelectorAll('[data-speed]').forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                if (state.running) { clearIntervals(); intervals.push(setInterval(tick, 1000)); intervals.push(setInterval(advanceAction, Math.max(800, 3000 / state.speed))); intervals.push(setInterval(updateMetrics, Math.max(500, 1500 / state.speed))); }
            });
        });
        $('btnSpeed1').classList.add('active');

        // Initial state
        renderIncidentBoard();
        renderAgents();
        renderMetrics();
    })();
    </script>
</body>
</html>
